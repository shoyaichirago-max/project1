<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=ul, initial-scale=1.0">
    <title>java script</title>
    <style>
        body {
            background-color: aliceblue(240.154.123);
            font-family: Arial, Helvetica, sans-serif;
            color: black;
            text-align: center;
            margin-top: 100px;
        }

        button {
            background-color: aqua;
            padding: 12px 25px;
            color: black(8, 8, 8,);
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

    </style>

</head>
<body>

    <h1 id="judul">Halo!</h1>

    <button onclick="klikTombol()">Klik Aku</button>

    <script>
        function klikTombol() {
            document.getElementById("judul").innerText = "kamu sudah Klik!😍";
        }
    </script>
    
</body>
</html>
